name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        uses: docker://koalaman/shellcheck:stable
        with:
          args: bin/commit-lint bin/semver-next bin/semver-release test/commit-lint.bats test/semver-next.bats test/semver-release.bats
      - name: shfmt
        uses: docker://mvdan/shfmt:latest
        with:
          args: -i 0 -ci -d bin/commit-lint bin/semver-next bin/semver-release

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats-core
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Configure git identity for test fixtures
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: bats
        run: bats test/
